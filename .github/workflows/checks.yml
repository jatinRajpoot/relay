name: Checks

# Reusable: the deploy workflow calls this so a red check blocks a deploy for the same
# commit. It is also runnable on its own for pull requests and by hand.
#
# There is deliberately no `push: main` trigger. A main push already runs this file as
# the deploy workflow's prerequisite, so a standalone main run would be a second, identical
# run of the same checks against the same SHA. Main is still gated: the deploy workflow
# cannot schedule its deploy job until this job passes.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {}

# Superseded pull request runs are cancelled. Runs reached through `workflow_call` are
# left alone: cancelling one would cancel the caller's gate and fail a deploy for a
# commit whose checks were never given a chance to finish.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check relay tests scripts

      - name: Test
        run: python -m pytest -q

  node:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Every `.mjs` file under tests/ is passed to `node --test`, with no content
      # sniffing. A suite may import `test` directly from `node:test` or re-export it
      # through a shared helper, and a grep for the literal would silently skip the
      # helper-importing suite — exactly the refactor these suites invite. A plain
      # helper module runs as a file with zero tests, which `node --test` accepts, so
      # running everything is both simpler and strictly safer than guessing. An empty
      # match fails loudly instead of passing a bare `node --test`, which would find
      # nothing and exit 0.
      #
      # `find | sort` emits one path per line and `mapfile` reads them back verbatim, so
      # paths containing spaces survive. (A helper with top-level side effects would now
      # execute; that is the same contract as any other test module.)
      - name: Run Node test suites
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t suites < <(find tests -type f -name '*.mjs' | sort)
          if [ "${#suites[@]}" -eq 0 ]; then
            echo "No tests/*.mjs files found." >&2
            exit 1
          fi
          printf '%s\n' "${suites[@]}"
          node --test "${suites[@]}"
