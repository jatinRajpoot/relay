name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: relay-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy relay
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/42733239266/locations/global/workloadIdentityPools/github-pool/providers/relay-github-provider
          service_account: relay-github-deployer@aitryout-485605.iam.gserviceaccount.com

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: relay
          project_id: aitryout-485605
          region: asia-south1
          source: .
          env_vars: |
            ENV_FILE=/secrets/relay/.env
            BASE_URL=https://relay-42733239266.asia-south1.run.app
            DATABASE_PATH=/tmp/relay.sqlite3
            DATABASE_BUCKET=aitryout-485605-relay-data
            INSTAGRAM_MEDIA_BUCKET=aitryout-485605-relay-media
            MAX_UPLOAD_BYTES=20971520
            YOUTUBE_REDIRECT_URI=https://relay-42733239266.asia-south1.run.app/oauth/youtube/callback
            INSTAGRAM_REDIRECT_URI=https://relay-42733239266.asia-south1.run.app/oauth/instagram/callback
          secrets: |
            /secrets/relay/.env=relay-config:1
          flags: >-
            --execution-environment=gen1
            --cpu=0.25
            --memory=256Mi
            --concurrency=1
            --min=0
            --max=1
            --cpu-throttling
            --no-cpu-boost
            --timeout=300
