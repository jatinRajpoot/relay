name: Deploy to Cloud Run

# A deploy is gated on the full check suite for the same commit. The checks job below
# calls the reusable .github/workflows/checks.yml, so Python lint, Python tests and every
# discovered Node suite must pass before the deploy job is even scheduled. This does not
# rely on branch protection: the dependency is inside the workflow itself, and it applies
# to manual dispatch too because dispatch runs the same jobs.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

# One production deployment at a time. Queued rather than cancelled: a half-finished
# deploy must never be interrupted by the next push.
concurrency:
  group: relay-production
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    # Reusable workflow. No secrets are passed, and the job is granted only read access,
    # so the check phase can never reach the deploy credentials. GitHub allows only
    # name/uses/with/secrets/strategy/needs/if/concurrency/permissions/cache-mode here.
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  deploy:
    name: Deploy relay
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deploy-only permissions: the OIDC token needed for Workload Identity Federation
    # exists only in this job, never in the checks job.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/42733239266/locations/global/workloadIdentityPools/github-pool/providers/relay-github-provider
          service_account: relay-github-deployer@aitryout-485605.iam.gserviceaccount.com

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: relay
          project_id: aitryout-485605
          region: asia-south1
          source: .
          env_vars: |
            ENV_FILE=/secrets/relay/.env
            BASE_URL=https://relay-42733239266.asia-south1.run.app
            DATABASE_PATH=/tmp/relay.sqlite3
            DATABASE_BUCKET=aitryout-485605-relay-data
            INSTAGRAM_MEDIA_BUCKET=aitryout-485605-relay-media
            MAX_UPLOAD_BYTES=20971520
            YOUTUBE_REDIRECT_URI=https://relay-42733239266.asia-south1.run.app/oauth/youtube/callback
            INSTAGRAM_REDIRECT_URI=https://relay-42733239266.asia-south1.run.app/oauth/instagram/callback
          secrets: |
            /secrets/relay/.env=relay-config:1
          flags: >-
            --execution-environment=gen1
            --cpu=0.25
            --memory=256Mi
            --concurrency=1
            --min=0
            --max=1
            --cpu-throttling
            --no-cpu-boost
            --timeout=300
