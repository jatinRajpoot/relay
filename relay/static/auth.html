<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f0e7">
  <title>Your account · Relay</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/account.css">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/auth.js" type="module"></script>
</head>
<body class="public-page auth-page">
  <a class="skip-link" href="#account-form">Skip to sign in</a>
  <header class="public-nav">
    <a class="brand" href="/" aria-label="Relay home"><span class="brand-mark"><i></i><i></i><i></i></span><span class="brand-name">relay<span>.</span></span></a>
    <a class="back-home" href="/">← Back to Relay</a>
  </header>
  <main class="auth-layout">
    <section class="auth-story" aria-labelledby="auth-story-title">
      <h1 id="auth-story-title">Your work,<br>in good <em>company.</em></h1>
    </section>
    <section class="auth-card" aria-labelledby="auth-title">
      <h2 id="auth-title">Log in to your studio.</h2>
      <form id="account-form">
        <div data-signup hidden>
          <label for="name">Your name</label>
          <input id="name" name="name" autocomplete="name" maxlength="80" placeholder="Alex Morgan" disabled>
        </div>
        <div>
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="username" maxlength="254" placeholder="you@example.com" required>
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="Your password" required>
          <small id="password-hint" data-signup hidden>Use at least 12 characters.</small>
        </div>
        <div data-signup hidden>
          <label for="workspace-name">First workspace</label>
          <input id="workspace-name" name="workspace_name" maxlength="80" placeholder="e.g. Northstar Studio" value="My workspace" disabled>
          <small>You can create more workspaces any time.</small>
        </div>
        <div class="form-error" id="account-error" role="alert" hidden></div>
        <button class="button button-primary button-block" id="account-submit" type="submit">Log in</button>
      </form>
      <p class="auth-switch"><span id="switch-prompt">New to Relay?</span> <a id="switch-link" href="/signup">Create an account</a></p>
    </section>
  </main>
</body>
</html>
