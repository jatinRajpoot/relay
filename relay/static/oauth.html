<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0e0c">
  <title>Connect your account · Relay</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="/static/oauth-complete.js" defer></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0c0b; --surface: #131816; --line: #242c28;
      --text: #e9efe9; --muted: #8b9a92; --faint: #64716a;
      --accent: #c6f56b; --accent-ink: #0d1a06;
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #f4f5f1; --surface: #fff; --line: #e1e5dc;
        --text: #101a14; --muted: #5f6f66; --faint: #83918a;
        --accent: #1c7a4b; --accent-ink: #fff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      padding: 20px;
      background: var(--bg); color: var(--text);
      font: 400 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .oauth-card {
      width: 100%; max-width: 360px;
      padding: 26px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--surface);
      text-align: center;
    }
    img { margin: 0 auto 16px; }
    .eyebrow {
      color: var(--faint);
      font-size: 10.5px; font-weight: 600;
      letter-spacing: 0.09em; text-transform: uppercase;
    }
    h1 { margin: 8px 0 8px; font-size: 20px; font-weight: 640; letter-spacing: -0.02em; }
    p { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
    .oauth-hint { color: var(--faint); font-size: 12px; }
    .button {
      display: inline-flex; align-items: center; justify-content: center;
      width: 100%; height: 38px;
      margin-top: 8px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: transparent;
      color: var(--text);
      font: inherit; font-size: 13px; font-weight: 570;
      text-decoration: none;
      cursor: pointer;
    }
    .button-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 640; }
    .button:hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <main class="oauth-card">
    <img src="/static/favicon.svg" width="40" height="40" alt="">
    <div class="eyebrow">Secure account connection</div>
    <h1 id="oauth-title">Opening sign-in…</h1>
    <p id="oauth-description">Keep this window open. Your provider’s sign-in page will appear here shortly.</p>
    <p class="oauth-hint" id="oauth-hint">If your provider reports an invalid redirect URI, close this window and follow the Setup guide in your workspace.</p>
    <a class="button button-primary" id="oauth-return" href="/" hidden>Return to workspace</a>
    <button class="button" id="oauth-close" type="button">Close window</button>
  </main>
</body>
</html>
