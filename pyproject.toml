[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-oauth"
version = "0.1.0"
description = "Instagram and YouTube OAuth and publishing service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135,<0.142",
  "uvicorn>=0.41,<0.53",
  "httpx>=0.28,<0.29",
  "cryptography>=46,<51",
  "python-dotenv>=1.2,<2",
  "python-multipart>=0.0.22,<0.1",
  "google-cloud-storage>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
include = ["relay*"]

[tool.setuptools.package-data]
relay = ["static/*", "static/app/*.js", "static/styles/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
